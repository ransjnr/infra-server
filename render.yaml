# Render Blueprint: Infra backend (gateway + 3 APIs + Render Key Value + external Postgres).
#
# PostgreSQL is expected from Supabase (or any Postgres URL). Set the same DATABASE_URL on every
# web service when Render prompts during Blueprint setup (sync: false), or paste it later under
# each service → Environment.
#
# Supabase: Project Settings → Database → Connection string → URI (prefer "Session pooler" /
# port 6543 when four services share the DB so you do not exhaust connections). Append sslmode=require
# if your client string does not already include it.
#
# Repo root should be this directory (infra-server). If Git root is a parent folder, set Root
# Directory to infra-server for each Docker web service in the dashboard.
#
# After deploy, set PUBLIC_BASE_URL on infra-gateway to the gateway https://…onrender.com URL.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: keyvalue
    name: infra-redis
    region: oregon
    plan: free
    ipAllowList: []

  - type: web
    name: infra-dataset-manager
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./services/dataset-manager/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: infra-redis
          property: connectionString

  - type: web
    name: infra-intelligence
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./services/intelligence/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: infra-redis
          property: connectionString
      - key: GHANA_NLP_API_KEY
        sync: false

  - type: web
    name: infra-speech
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./services/speech/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: infra-redis
          property: connectionString
      - key: GHANA_NLP_API_KEY
        sync: false
      - key: INTELLIGENCE_SERVICE_URL
        fromService:
          type: web
          name: infra-intelligence
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: infra-gateway
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./services/gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: infra-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_ENABLED
        value: "true"
      - key: DATASET_MANAGER_URL
        fromService:
          type: web
          name: infra-dataset-manager
          envVarKey: RENDER_EXTERNAL_URL
      - key: INTELLIGENCE_SERVICE_URL
        fromService:
          type: web
          name: infra-intelligence
          envVarKey: RENDER_EXTERNAL_URL
      - key: SPEECH_SERVICE_URL
        fromService:
          type: web
          name: infra-speech
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
